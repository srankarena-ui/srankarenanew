<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>S-Rank Arena</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>S-Rank Arena</h1>

    <section id="login">
      <p class="hint">Inicia sesión con tu cuenta de S-Rank Arena.</p>
      <form id="login-form">
        <input id="email" type="email" placeholder="Email" autocomplete="username" required />
        <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password" required />
        <button type="submit" id="login-button">Entrar</button>
      </form>
      <p id="login-error" class="error" role="alert"></p>
    </section>

    <section id="app" hidden>
      <p class="account">
        <strong id="account-email"></strong>
        <span class="badge" id="badge-streamer" hidden>🎥 Streamer</span>
        <br /><span class="hint" id="account-sub"></span>
      </p>

      <h2>Castigos</h2>
      <ul id="retos" class="log" aria-live="polite">
        <li class="hint">Cargando…</li>
      </ul>

      <h2>Streamer</h2>
      <p class="hint" id="streamer-no" hidden>
        El apartado de streamer lo concede un administrador desde el panel.
      </p>
      <p class="hint" id="streamer-si" hidden>
        Overlay para OBS disponible. Pendiente de integrar en el cliente.
      </p>

      <button id="logout" class="secondary">Cerrar sesión</button>
    </section>

    <script src="main.js"></script>
  </body>
</html>
