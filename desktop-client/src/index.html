<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>S-Rank Arena</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Pantalla de entrada. Ocupa todo hasta que hay sesión. -->
    <section id="login">
      <h1>S-Rank Arena</h1>
      <p class="hint">
        Se abrirá S-Rank Arena en tu navegador para que inicies sesión.
        Tu contraseña no pasa por aquí.
      </p>
      <button type="button" id="login-button">Entrar</button>
      <p id="login-hint" class="hint" hidden>
        Termina en el navegador y vuelve a esta ventana.
      </p>
      <p id="login-error" class="error" role="alert"></p>
    </section>

    <!-- Con sesión: barra propia arriba y la web debajo. La barra es lo que
         un navegador no puede darte — estado del juego, castigo activo,
         avisos— y por eso esto es una aplicación y no una pestaña. -->
    <div id="app" hidden>
      <header class="barra">
        <div class="marca">S-RANK</div>

        <div class="estado">
          <span class="punto" id="punto-juego"></span>
          <span id="texto-juego">Comprobando…</span>
        </div>

        <div class="castigo" id="castigo" hidden>
          <span class="etiqueta">Castigo</span>
          <strong id="castigo-nombre"></strong>
          <span id="castigo-estado" class="sub"></span>
        </div>

        <div class="hueco"></div>

        <div class="cuenta">
          <span id="account-email"></span>
          <span class="badge" id="badge-streamer" hidden>🎥</span>
        </div>
        <button id="logout" class="secondary pequeno">Salir</button>
      </header>

      <!-- La web, tal cual. No se replica: cambia cada semana y mantener dos
           versiones las separa solas. -->
      <iframe id="web" title="S-Rank Arena"></iframe>
    </div>

    <script src="main.js"></script>
  </body>
</html>
